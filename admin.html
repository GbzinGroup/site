<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin | Wiki | Gbzin Group</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Painel administrativo da Wiki Gbzin Group">
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="/gbzin-group/assets/css/admin.css">
  
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo" aria-hidden="true">🔐</div>
      <h1 class="login-title">Painel Administrativo</h1>
      <p class="login-subtitle">Acesse para gerenciar a Wiki</p>
    </div>

    <div class="error-message" id="errorMessage" role="alert" aria-live="polite"></div>
    <div class="success-message" id="successMessage" role="status" aria-live="polite"></div>

    <form id="loginForm" autocomplete="on" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          placeholder="admin@password"
          required
          autocomplete="email"
          inputmode="email"
          spellcheck="false"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="••••••••"
          required
          autocomplete="current-password"
          minlength="6"
        >
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        Entrar
      </button>
    </form>

    <div class="debug-info" id="debugInfo" aria-hidden="true">
      Status: Aguardando inicialização...
    </div>
  </div>

  <script src="/assets/js/admin.js"></script>

</body>
</html>
