<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog do Gbzin Group - artigos, tutoriais e novidades.">
  <meta name="robots" content="index, follow">
  <title>Blog | Gbzin Group</title>

  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/geral.css">
  <link rel="stylesheet" href="assets/css/blog.css">
</head>
<body>

  <main class="blog-page">
    <header class="blog-hero">
      <span class="section-badge">Blog</span>
      <h1>Artigos e <span class="gradient-text">Novidades</span></h1>
      <p>Tutoriais, dicas e novidades sobre tecnologia, hospedagem e desenvolvimento.</p>

      <div class="blog-search">
        <i class="fas fa-search"></i>
        <input type="text" id="busca" placeholder="Buscar artigos..." aria-label="Buscar artigos">
      </div>
    </header>

    <section class="blog-filters" id="filtros">
      <button class="filter-btn active" data-cat="all">Todos</button>
      <button class="filter-btn" data-cat="tutorial">Tutoriais</button>
      <button class="filter-btn" data-cat="noticia">Notícias</button>
      <button class="filter-btn" data-cat="dica">Dicas</button>
      <button class="filter-btn" data-cat="produto">Produtos</button>
    </section>

    <section class="blog-grid" id="posts-grid" aria-live="polite">
      <div class="loading">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Carregando posts...</p>
      </div>
    </section>

    <div class="blog-pagination" id="paginacao"></div>
  </main>

  <script src="assets/js/blog.js" defer></script>
</body>
</html>
